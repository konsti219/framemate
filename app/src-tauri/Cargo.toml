# Standalone, not part of the root (agent) workspace.
[workspace]

[package]
name = "framemate-app"
description = "FrameMate companion app"
version = "0.1.1"
edition = "2024"

[lib]
# Unique lib name avoids a bin/lib name clash (cargo#8519).
name = "framemate_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
