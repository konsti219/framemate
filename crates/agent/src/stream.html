<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameMate · headset view</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; background: #000; color: #ccc; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  video, canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  [hidden] { display: none; }
  #status { position: fixed; left: 8px; bottom: 8px; opacity: .7; }
</style>
</head>
<body>
<video autoplay muted playsinline hidden></video>
<canvas hidden></canvas>
<div id="status">connecting…</div>
<script type="module">
// Headset view, see player.js. Low latency (WebCodecs) needs a secure context: localhost, HTTPS, or
// Chromium with --unsafely-treat-insecure-origin-as-secure=http://<this host>:7380.
import { startPlayer } from "/player.js";

const token = new URLSearchParams(location.search).get("token") ?? "";
const status = document.getElementById("status");
const proto = location.protocol === "https:" ? "wss" : "ws";
startPlayer({
  url: `${proto}://${location.host}/api/stream/ws?token=${encodeURIComponent(token)}`,
  video: document.querySelector("video"),
  canvas: document.querySelector("canvas"),
  onStatus: text => {
    status.textContent = text || (typeof VideoDecoder !== "undefined" ? "live · WebCodecs" : "live · MSE");
  },
});
</script>
</body>
</html>
