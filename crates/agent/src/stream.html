<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameMate · headset view</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; background: #000; color: #ccc; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  video { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #status { position: fixed; left: 8px; bottom: 8px; opacity: .7; }
</style>
</head>
<body>
<video autoplay muted playsinline></video>
<div id="status">connecting…</div>
<script>
// Headset view over /api/stream/ws: a JSON header with the codec string, then an fMP4
// init segment, then one moof+mdat per frame, fed into Media Source Extensions.
// (WebCodecs would be simpler but needs a secure context, which http://frame.local isn't.)
const token = new URLSearchParams(location.search).get("token") ?? "";
const video = document.querySelector("video");
const status = document.getElementById("status");

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/stream/ws?token=${encodeURIComponent(token)}`);
  ws.binaryType = "arraybuffer";
  let buffer = null;
  const queue = [];
  const pump = () => {
    if (buffer && !buffer.updating && queue.length) buffer.appendBuffer(queue.shift());
  };

  ws.onmessage = e => {
    if (typeof e.data !== "string") {
      queue.push(e.data);
      pump();
      return;
    }
    const { codec } = JSON.parse(e.data);
    const type = `video/mp4; codecs="${codec}"`;
    if (!MediaSource.isTypeSupported(type)) {
      status.textContent = `this browser can't play ${type}`;
      ws.onclose = null;
      ws.close();
      return;
    }
    const source = new MediaSource();
    video.src = URL.createObjectURL(source);
    source.addEventListener("sourceopen", () => {
      buffer = source.addSourceBuffer(type);
      buffer.mode = "sequence";
      buffer.addEventListener("updateend", () => { keepLive(buffer); pump(); });
      pump();
    }, { once: true });
    status.textContent = `live · ${codec}`;
  };
  ws.onclose = () => {
    status.textContent = "disconnected, retrying…";
    setTimeout(connect, 2000);
  };
}

// MSE buffers by default, which adds latency over time. Catch up by playing slightly
// faster; only seek when far behind, because every seek makes the decoder restart
// from the previous keyframe (seeking on every frame showed ~3 fps).
function keepLive(buffer) {
  if (buffer.updating || !buffer.buffered.length) return;
  const start = buffer.buffered.start(0);
  const end = buffer.buffered.end(buffer.buffered.length - 1);
  const behind = end - video.currentTime;
  if (video.currentTime < start || behind > 2) {
    video.currentTime = Math.max(start, end - 0.2);
  }
  video.playbackRate = behind > 0.3 ? 1.1 : 1.0;
  if (video.paused) video.play().catch(() => {});
  if (video.currentTime - start > 10) buffer.remove(start, video.currentTime - 5);
}

connect();
</script>
</body>
</html>
