<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameMate</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  body { margin: 16px; font: 14px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  pre { margin: 0; white-space: pre-wrap; }
</style>
</head>
<body>
<p><a id="stream">headset view</a></p>
<pre id="out">connecting…</pre>
<script>
// Plain-text readout of /api/ws, intentionally unstyled.
const token = new URLSearchParams(location.search).get("token") ?? "";
const out = document.getElementById("out");
document.getElementById("stream").href = `/stream?token=${encodeURIComponent(token)}`;
let last = null;
let link = "connecting";

const pct = v => (v == null ? "?" : `${Math.round(v * 100)}%`);
const bytes = n => {
  if (n == null) return "?";
  const units = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return `${n.toFixed(i ? 1 : 0)} ${units[i]}`;
};
const dur = s => {
  if (s == null || s < 0) return "?";
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? `${h}h ${m}m` : m ? `${m}m ${Math.floor(s % 60)}s` : `${Math.floor(s)}s`;
};
const time = ms => (ms ? new Date(ms).toLocaleTimeString() : "never");
const pad = (s, n) => String(s ?? "").padEnd(n);
const HMD_ACTIVITY = { "-1": "unknown", 0: "idle", 1: "in use", 2: "in use (timeout)", 3: "standby", 4: "idle (timeout)" };

function render(s) {
  const t = s.steam.topics, L = [];
  L.push(`FrameMate agent ${s.agent.version} on ${s.agent.hostname} · updated ${time(s.agent.updated_at_ms)} · ${link}`);
  L.push(`Steam: ${s.steam.connected ? "connected" : `not connected (${s.steam.error ?? "?"})`} · last event ${time(s.steam.last_event_ms)}`);

  // Steam's percentage (≈ kernel / 0.9, matches the headset UI); kernel adds W/°C and is the
  // fallback without Steam.
  L.push("", "== Battery");
  const b = t.battery, k = s.power?.battery;
  if (b) {
    // seconds_remaining is time-to-full while on AC.
    L.push(`${pct(b.level)}  ${b.ac_state === 2 ? `charging, full in ~${dur(b.seconds_remaining)}` : `on battery, ~${dur(b.seconds_remaining)} left`}`);
  } else if (k) {
    L.push(`${k.capacity_percent}% (raw gauge, Steam not connected)  ${k.status}`);
  }
  if (k) L.push(`${Math.abs(k.power_w ?? 0).toFixed(1)} W  ${k.temp_c?.toFixed(1)} °C  health ${k.health}  cycles ${k.cycle_count}`);

  L.push("", "== VR devices");
  for (const d of t.vr_devices ?? [])
    L.push(`${pad(d.model, 14)} ${pad(pct(d.battery), 5)} ${d.charging ? "charging " : "         "} ${d.connected ? "connected" : "not connected"}`);
  const vr = t.vr_state;
  if (vr) L.push(`Headset: ${HMD_ACTIVITY[vr.hmd_activity] ?? vr.hmd_activity}  ·  VR app: ${vr.scene_app_name ?? vr.scene_appid ?? "none"}`);

  L.push("", "== Now playing");
  const running = t.running_apps ?? [];
  L.push(running.length ? running.map(a => `${a.name} (${a.appid})`).join(", ") : "nothing");
  const ev = t.last_app_event;
  if (ev) L.push(`last event: ${ev.name ?? ev.appid} ${ev.running ? "started" : "stopped"} at ${time(ev.at_ms)}`);

  L.push("", "== Downloads");
  const o = t.download_overview;
  if (o?.appid) {
    L.push(`Now: ${o.name ?? o.appid}${o.is_workshop ? " (workshop)" : ""}  ${o.state}${o.paused ? " (paused)" : ""}` +
      `  ${o.percent}%  ${bytes(o.bytes_per_sec)}/s  ETA ${dur(o.eta_sec)}`);
  } else {
    L.push("Now: idle");
  }
  const items = [...(t.downloads ?? [])].sort((a, b) => (a.completed - b.completed) || (a.queue_index - b.queue_index));
  for (const i of items) {
    const st = i.completed ? "done" : i.active ? "active" : i.paused ? "paused" : `queued #${i.queue_index}`;
    L.push(`${pad(st, 10)} ${pad(i.name ?? i.appid, 40)} ${i.completed ? "" : i.percent != null ? `${i.percent}%` : ""}${i.error ? `  error: ${i.error}` : ""}`);
  }

  L.push("", "== Headset stream");
  const st = s.stream;
  L.push(st ? `${st.viewers} viewer(s)  ${st.width}x${st.height} H.264  ${st.fps.toFixed(1)} fps (source ${st.source_fps.toFixed(0)})` +
    `  ${(st.kbit_per_sec / 1000).toFixed(1)} Mbit/s  ${st.encode_ms.toFixed(1)} ms/frame CPU` : "off (no viewers)");

  L.push("", "== Network");
  const n = t.network;
  if (n) {
    L.push(`connected ${n.connected}  internet ${n.internet}  steam ${n.steam}`);
    for (const i of n.interfaces) L.push(`${pad(i.name, 8)} rx ${bytes(i.rx_bytes_per_sec)}/s  tx ${bytes(i.tx_bytes_per_sec)}/s`);
  }

  L.push("", "== Performance");
  const so = s.steamos;
  if (so.available) for (const [key, v] of Object.entries(so.properties)) L.push(`${pad(key, 26)} ${Array.isArray(v) ? v.join(" / ") : v}`);
  else L.push(`steamos-manager: ${so.error ?? "not available"}`);
  const p = t.perf;
  if (p) L.push(`TDP limit ${p.tdp_limit_w ?? "off"}  FPS limit ${p.fps_limit ?? "off"}  battery temp ${p.battery_temp_c ?? "?"} °C`);

  L.push("", "== System");
  const si = t.system_info;
  if (si) {
    L.push(`${si.os} ${si.os_version} (${si.os_variant}) build ${si.os_build}  kernel ${si.kernel}`);
    L.push(`Steam ${si.steam_version} (${si.steam_build_date})  ${si.gpu} / ${si.gpu_driver}  ${si.cpu_cores} cores  ${si.ram_mb} MB`);
  }
  const u = t.user;
  if (u) L.push(`User: ${u.persona_name ?? "?"} (${u.account_name ?? "?"})`);

  const errors = Object.entries(s.steam.topic_errors);
  if (errors.length) {
    L.push("", "== Shim errors");
    for (const [topic, msg] of errors) L.push(`${topic}: ${msg}`);
  }
  L.push("", `raw JSON: /api/state?token=…`);
  out.textContent = L.join("\n");
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { link = "live"; };
  ws.onmessage = e => { last = JSON.parse(e.data); render(last); };
  ws.onclose = () => {
    link = "disconnected, retrying";
    if (last) render(last); else out.textContent = "cannot connect (wrong token?), retrying…";
    setTimeout(connect, 2000);
  };
}
connect();
</script>
</body>
</html>
